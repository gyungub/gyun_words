
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>균 끝말잇기 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #eef2ff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-main);
    background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
}

.app {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

header {
    text-align: center;
    margin-bottom: 8px;
}

.title-badge {
    display: inline-block;
    padding: 4px 12px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    border-radius: 20px;
    margin-bottom: 8px;
}

h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-main);
}

.sub {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 14px;
}

.panel {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-lg);
}

/* 검색창 */

.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.input-wrapper {
    position: relative;
    flex: 1;
}

input[type="text"] {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
    background: #ffffff;
    color: var(--text-main);
    transition: all 0.2s ease;
}

input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.btn-secondary {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid var(--border);
}

.btn-secondary:hover {
    background: #e2e8f0;
}

.btn-secondary.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.btn-danger {
    background: var(--danger-light);
    color: var(--danger);
}

.btn-danger:hover {
    background: #fee2e2;
}

/* 툴바 및 필터 */

.tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
}

.mode-group {
    display: flex;
    background: #f1f5f9;
    padding: 3px;
    border-radius: 10px;
    gap: 2px;
}

.mode-group button {
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    border: none;
}

.mode-group button.active {
    background: white;
    color: var(--text-main);
    box-shadow: var(--shadow-sm);
    font-weight: 700;
}

.action-group {
    display: flex;
    gap: 6px;
}

.action-group button {
    padding: 6px 12px;
    font-size: 12.5px;
}

/* 통계 표시 */

.stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 500;
}

.stats .count-highlight {
    color: var(--primary);
    font-weight: 700;
}

/* 단어 목록 */

.list {
    display: grid;
    gap: 8px;
    max-height: 52vh;
    overflow-y: auto;
    padding-right: 4px;
}

.list::-webkit-scrollbar {
    width: 6px;
}

.list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
}

.word-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    transition: all 0.15s ease;
}

.word-card:hover {
    border-color: #cbd5e1;
    box-shadow: var(--shadow-sm);
    transform: translateX(2px);
}

.word-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.word-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
}

.syllable-badge {
    font-size: 11px;
    font-weight: 600;
    background: #f1f5f9;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 6px;
}

.btn-delete {
    background: transparent;
    color: #94a3b8;
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 6px;
}

.btn-delete:hover {
    background: var(--danger-light);
    color: var(--danger);
}

.empty {
    padding: 48px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    background: #ffffff;
    border: 1px dashed var(--border);
    border-radius: 12px;
}

/* 모달/다이얼로그 */

dialog {
    width: min(500px, calc(100% - 32px));
    margin: auto;
    border: none;
    border-radius: 20px;
    padding: 0;
    box-shadow: var(--shadow-lg);
    background: white;
}

dialog::backdrop {
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
}

.dialog-inner {
    padding: 24px;
}

.dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.dialog-header h2 {
    font-size: 18px;
    font-weight: 700;
}

textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}

textarea:focus {
    border-color: var(--primary);
}

.hint {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.5;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.dialog-actions button {
    padding: 10px 16px;
}
</style>
</head>

<body>

<div class="app">

    <header>
        <span class="title-badge">끝말잇기 도우미</span>
        <h1>균 끝말잇기 단어장</h1>
        <p class="sub">개인 단어 저장소 · 실시간 끝말 검색 · 데이터 백업</p>
    </header>

    <main class="panel">

        <!-- 검색창 -->
        <div class="search-box">
            <div class="input-wrapper">
                <input
                    id="search"
                    type="text"
                    placeholder="단어 검색..."
                    autocomplete="off"
                >
            </div>
            <button id="addBtn" class="btn-primary">
                + 추가
            </button>
        </div>

        <!-- 툴바 버튼 -->
        <div class="tools">
            <div class="mode-group">
                <button id="allBtn" class="active">전체</button>
                <button id="startsBtn">첫 글자</button>
                <button id="endsBtn">끝 글자</button>
            </div>

            <div class="action-group">
                <button id="importBtn" class="btn-secondary">가져오기</button>
                <button id="exportBtn" class="btn-secondary">내보내기</button>
                <button id="clearBtn" class="btn-danger">전체 삭제</button>
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats">
            <span>등록된 단어: <span id="count" class="count-highlight">0개</span></span>
            <span id="mode">전체 검색 모드</span>
        </div>

        <!-- 단어 목록 -->
        <div id="list" class="list"></div>

    </main>

</div>

<!-- 단어 추가 팝업 -->
<dialog id="addDialog">
    <div class="dialog-inner">
        <div class="dialog-header">
            <h2>단어 대량 추가</h2>
        </div>

        <textarea
            id="wordInput"
            placeholder="한 줄에 단어를 하나씩 입력하세요.&#10;&#10;예시:&#10;가방&#10;방울&#10;울타리"
        ></textarea>

        <p class="hint">
            💡 줄바꿈으로 여러 단어를 한 번에 추가할 수 있으며, 중복 단어는 자동으로 제외됩니다. (Ctrl + Enter로 바로 저장)
        </p>

        <div class="dialog-actions">
            <button class="btn-secondary" id="cancelAdd">취소</button>
            <button class="btn-primary" id="saveAdd">저장하기</button>
        </div>
    </div>
</dialog>

<input
    id="fileInput"
    type="file"
    accept=".json,application/json"
    hidden
>

<script>
const STORAGE_KEY = "gyun_wordbook_v1";

let words = loadWords();
let mode = "all";
let query = "";

const $ = id => document.getElementById(id);
const search = $("search");
const list = $("list");
const count = $("count");
const modeText = $("mode");
const dialog = $("addDialog");
const wordInput = $("wordInput");

function loadWords() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(saved)) return [];
        return [...new Set(saved.map(x => String(x).trim()).filter(Boolean))];
    } catch {
        return [];
    }
}

function saveWords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
}

function firstSyllable(word) {
    return [...word][0] || "";
}

function lastSyllable(word) {
    return [...word].at(-1) || "";
}

function render() {
    const q = query.trim().toLowerCase();

    let filtered = words.filter(word => {
        const w = word.toLowerCase();
        const first = firstSyllable(w);
        const last = lastSyllable(w);

        if (mode === "all" && q && !w.includes(q)) return false;
        if (mode === "starts" && q && !first.startsWith(q)) return false;
        if (mode === "ends" && q && !last.startsWith(q)) return false;

        return true;
    });

    filtered.sort((a, b) => a.localeCompare(b, "ko"));

    count.textContent = `${filtered.length}개`;

    if (mode === "starts") {
        modeText.textContent = "첫 글자 검색 모드";
    } else if (mode === "ends") {
        modeText.textContent = "끝 글자 검색 모드";
    } else {
        modeText.textContent = "전체 검색 모드";
    }

    list.innerHTML = "";

    if (!filtered.length) {
        list.innerHTML = `
            <div class="empty">
                ${words.length ? "검색 조건에 맞는 단어가 없습니다." : "등록된 단어가 없습니다. 우측 상단버튼으로 단어를 추가해보세요!"}
            </div>
        `;
        return;
    }

    const fragment = document.createDocumentFragment();

    filtered.forEach(word => {
        const card = document.createElement("div");
        card.className = "word-card";

        const info = document.createElement("div");
        info.className = "word-info";

        const name = document.createElement("span");
        name.className = "word-name";
        name.textContent = word;

        const badge = document.createElement("span");
        badge.className = "syllable-badge";
        badge.textContent = `${firstSyllable(word)} ➔ ${lastSyllable(word)}`;

        info.append(name, badge);

        const del = document.createElement("button");
        del.className = "btn-delete";
        del.textContent = "삭제";

        del.onclick = () => {
            words = words.filter(x => x !== word);
            saveWords();
            render();
        };

        card.append(info, del);
        fragment.appendChild(card);
    });

    list.appendChild(fragment);
}

function setMode(newMode, btnElement, placeholderText) {
    mode = newMode;
    document.querySelectorAll(".mode-group button").forEach(b => b.classList.remove("active"));
    btnElement.classList.add("active");
    search.placeholder = placeholderText;
    render();
    search.focus();
}

$("addBtn").onclick = () => {
    wordInput.value = "";
    dialog.showModal();
    setTimeout(() => wordInput.focus(), 0);
};

$("cancelAdd").onclick = () => dialog.close();

function addWords(text) {
    const incoming = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    words = [...new Set([...words, ...incoming])];
    saveWords();
    render();
}

$("saveAdd").onclick = () => {
    addWords(wordInput.value);
    dialog.close();
};

wordInput.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        addWords(wordInput.value);
        dialog.close();
    }
});

search.addEventListener("input", e => {
    query = e.target.value;
    render();
});

$("startsBtn").onclick = (e) => setMode("starts", e.target, "시작하는 글자 입력...");
$("endsBtn").onclick = (e) => setMode("ends", e.target, "끝나는 글자 입력...");
$("allBtn").onclick = (e) => setMode("all", e.target, "단어 검색...");

$("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(words, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "gyun-wordbook.json";
    a.click();
    URL.revokeObjectURL(url);
};

$("importBtn").onclick = () => $("fileInput").click();

$("fileInput").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;

    try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error();

        words = [...new Set([...words, ...data.map(x => String(x).trim()).filter(Boolean)])];
        saveWords();
        render();
    } catch {
        alert("올바른 단어장 JSON 파일이 아닙니다.");
    }
    e.target.value = "";
};

$("clearBtn").onclick = () => {
    if (!words.length) return;
    if (confirm(`정말 ${words.length}개의 단어를 전부 삭제할까요?`)) {
        words = [];
        saveWords();
        render();
    }
};

render();
</script>

</body>
</html>
